name: CI

# Every push is built and tested. A push to main is then deployed, once the tests
# pass and the deploy has been switched on (see README, "Tests and CI/CD").
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces an older run, except on main, where a deploy must finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Run the Playwright tests
        run: npx playwright test

      - name: Keep the test report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy to Vercel
    needs: test
    # Off until the repository variable VERCEL_DEPLOY is set to "true".
    if: github.ref == 'refs/heads/main' && vars.VERCEL_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch the Vercel project settings
        run: npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: npx vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        run: npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
